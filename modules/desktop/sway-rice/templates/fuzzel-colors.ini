# noctalia user-template çıktısı → ~/.config/fuzzel/colors.ini
# programs.fuzzel'in ana config'i `include=~/.config/fuzzel/colors.ini` ile
# bunu çeker (hm.nix). fuzzel renkleri AARRGGBB (alfa önde) bekler.
[colors]
background=ff{{ colors.surface.default.hex }}
text=ff{{ colors.on_surface.default.hex }}
match=ff{{ colors.primary.default.hex }}
selection=ff{{ colors.surface_container_high.default.hex }}
selection-match=ff{{ colors.primary.default.hex }}
selection-text=ff{{ colors.on_surface.default.hex }}
border=ff{{ colors.outline.default.hex }}
