# matugen şablonu → çıktı: ~/.config/hypr/hyprlock-colors.conf (ELLE DÜZENLENMEZ)
# hyprlock.conf bunu `source` ile en başta okur; hyprlang $değişken sözdizimi
# (rgb(RRGGBB), hex_stripped '#' taşımaz).
$surface  = rgb({{colors.surface.default.hex_stripped}})
$bg_alt   = rgb({{colors.surface_container.default.hex_stripped}})
$fg       = rgb({{colors.on_surface.default.hex_stripped}})
$primary  = rgb({{colors.primary.default.hex_stripped}})
$error    = rgb({{colors.error.default.hex_stripped}})
$tertiary = rgb({{colors.tertiary.default.hex_stripped}})
